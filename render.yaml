# Render blueprint for the contact endpoint.
#
# The site itself is a static build and deploys separately. This file describes
# the single service the contact form needs, so Render can create it from this
# repository instead of it being clicked together by hand.
#
# Point Render at this repo, choose "Blueprint", and it will provision the
# service below. It will ask for the two secrets marked `sync: false`.
services:
  - type: web
    name: portfolio-contact-endpoint
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # From resend.com/api-keys. Asked for at creation, never committed.
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        value: mail4shritejkoneru@gmail.com
      # Resend's shared sender. It only delivers to the address the Resend
      # account belongs to, which is exactly what this form needs. Swap in a
      # verified domain address later and mail can go anywhere.
      - key: CONTACT_FROM_EMAIL
        value: onboarding@resend.dev
      - key: CONTACT_FROM_NAME
        value: Portfolio contact form
      # Comma-separated origins. Leave blank to accept any origin.
      - key: ALLOWED_ORIGINS
        sync: false
